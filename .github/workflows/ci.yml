name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify OpenSSL
        run: openssl version

      - name: Compile
        run: python3 -m compileall -q opspilot tests

      - name: Unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Validate DevControl example contract
        run: python3 -m opspilot validate-project --project-file examples/devcontrol.project.example.json
