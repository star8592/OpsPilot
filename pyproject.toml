name = "opspilot"
version = "0.2.0"
description = "Policy-driven production delivery control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
opspilot = "opspilot.cli:main"

[tool.setuptools]
packages = ["opspilot"]
